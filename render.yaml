# Render blueprint — production in one click for Djini's Bakehouse.
#
# How to use:
#   1. Push this repo to GitHub/GitLab.
#   2. Render dashboard -> New -> Blueprint -> pick the repo.
#   3. Render asks for the "sync: false" values — ADMIN_EMAIL and
#      ADMIN_PASSWORD are the shop's first login; the STRIPE_* keys come
#      from the Stripe dashboard and the PAYPAL_* ones from PayPal's
#      developer dashboard (both optional: without them the shop runs on
#      cash on delivery alone). Everything else (SECRET_KEY, the Postgres
#      URL) is created for you. No key is ever written in this file.
#   4. Deploy. Attach your domain in the service settings; TLS is automatic.
#
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: djinis-bakehouse
    runtime: python
    plan: starter # always-on; the free tier sleeps between visits
    region: oregon # pick the region nearest your customers
    branch: main
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build && cd ..
    startCommand: uvicorn app:app --app-dir backend --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    disk: # uploaded photos live on a disk so they survive redeploys
      name: uploads
      mountPath: /data/uploads
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true # a long random secret, created and managed by Render
      - key: DATABASE_URL
        fromDatabase:
          name: bakehouse-db
          property: connectionString
      - key: SEED_DEMO_DATA
        value: "false" # catalog only — no demo customers, orders or reviews
      # The owner's approved EUR money rules (2026-11-06): delivery €2.99,
      # free from €25.00 (VIP regulars from €15.00), register rate 7 %.
      # These are the fail-closed pair's approved values — while either
      # delivery figure is missing, checkout pauses itself rather than
      # charge an unapproved amount.
      - key: TAX_RATE
        value: "0.07"
      - key: SHIPPING_FEE
        value: "2.99"
      - key: FREE_SHIPPING_THRESHOLD
        value: "25.00"
      - key: VIP_FREE_DELIVERY_THRESHOLD
        value: "15.00"
      # Online payments. Every value below is set by hand in the dashboard —
      # the going-live procedure is docs/operations/PAYMENTS_GO_LIVE.md, and
      # `python backend/scripts/check_payments.py` (Render shell) verifies it.
      - key: STRIPE_SECRET_KEY
        sync: false # from the Stripe dashboard — set it and card checkout appears (sk_test_… rehearses, sk_live_… charges; empty = no card option)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # signing secret (whsec_…) of the endpoint delivering to /api/payments/webhook — test and live endpoints have different ones
      - key: PAYPAL_CLIENT_ID
        sync: false # PayPal REST app credentials — set both and the PayPal option appears (empty = no PayPal)
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENVIRONMENT
        sync: false # "sandbox" or "live" — which PayPal the credentials belong to (empty = sandbox)
      - key: PAYPAL_WEBHOOK_ID
        sync: false # id of the PayPal webhook delivering to /api/payments/paypal/webhook
      - key: FACEBOOK_APP_ID
        sync: false # from developers.facebook.com — set with the secret and "Continue with Facebook" appears on the login page
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false # all three together switch on phone sign-in codes (SMS via Twilio)
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false # the Twilio number the texts come from, e.g. +15005550100
      # Outgoing email. Without SMTP_HOST the shop sends NOTHING — no
      # receipts, order updates, password resets or desk alerts (boot logs
      # "Email is OFF"). Set these in the dashboard from your mail provider's
      # SMTP page. The port defaults to 587 (STARTTLS); add SMTP_PORT by hand
      # only if your provider uses another — it is left out here on purpose,
      # because a blank numeric variable would stop the app from booting.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false # e.g. Djini's Bakehouse <no-reply@djinisbakehouse.com>
      # The rate limits key on the visitor's address. To key them on the
      # address the edge itself reports (not a caller-writable first
      # X-Forwarded-For hop), add CLIENT_IP_HEADER in the dashboard — see
      # backend/.env.example. Verify what your edge sends before setting it.
      - key: ADMIN_EMAIL
        sync: false # you set this when the blueprint is applied
      - key: ADMIN_PASSWORD
        sync: false
      - key: UPLOADS_DIR
        value: /data/uploads
      - key: ENABLE_DOCS
        value: "false" # hide /api/docs from the public internet
      - key: SERVE_FRONTEND_DIST
        value: "true" # one origin: the API also serves the built SPA

databases:
  - name: bakehouse-db
    plan: basic-256mb # ~$7/mo; bump it when the order book grows
    region: oregon
