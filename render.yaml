# Render blueprint — production in one click for Djini's Bakehouse.
#
# How to use:
#   1. Push this repo to GitHub/GitLab.
#   2. Render dashboard -> New -> Blueprint -> pick the repo.
#   3. Render asks for the "sync: false" values — ADMIN_EMAIL and
#      ADMIN_PASSWORD are the shop's first login; the STRIPE_* keys come
#      from the Stripe dashboard (optional: without them the shop runs on
#      cash on delivery alone). Everything else (SECRET_KEY, the Postgres
#      URL) is created for you.
#   4. Deploy. Attach your domain in the service settings; TLS is automatic.
#
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: djinis-bakehouse
    runtime: python
    plan: starter # always-on; the free tier sleeps between visits
    region: oregon # pick the region nearest your customers
    branch: main
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build && cd ..
    startCommand: uvicorn app:app --app-dir backend --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    disk: # uploaded photos live on a disk so they survive redeploys
      name: uploads
      mountPath: /data/uploads
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true # a long random secret, created and managed by Render
      - key: DATABASE_URL
        fromDatabase:
          name: bakehouse-db
          property: connectionString
      - key: SEED_DEMO_DATA
        value: "false" # catalog only — no demo customers, orders or reviews
      # The owner's approved EUR money rules (2026-11-06): delivery €2.99,
      # free from €25.00 (VIP regulars from €15.00), register rate 7 %.
      # These are the fail-closed pair's approved values — while either
      # delivery figure is missing, checkout pauses itself rather than
      # charge an unapproved amount.
      - key: TAX_RATE
        value: "0.07"
      - key: SHIPPING_FEE
        value: "2.99"
      - key: FREE_SHIPPING_THRESHOLD
        value: "25.00"
      - key: VIP_FREE_DELIVERY_THRESHOLD
        value: "15.00"
      - key: STRIPE_SECRET_KEY
        sync: false # from the Stripe dashboard — set it and card checkout goes live (leave empty for cash-only)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # signing secret of the webhook endpoint you create in the Stripe dashboard
      - key: FACEBOOK_APP_ID
        sync: false # from developers.facebook.com — set with the secret and "Continue with Facebook" appears on the login page
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false # all three together switch on phone sign-in codes (SMS via Twilio)
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false # the Twilio number the texts come from, e.g. +15005550100
      - key: ADMIN_EMAIL
        sync: false # you set this when the blueprint is applied
      - key: ADMIN_PASSWORD
        sync: false
      - key: UPLOADS_DIR
        value: /data/uploads
      - key: ENABLE_DOCS
        value: "false" # hide /api/docs from the public internet
      - key: SERVE_FRONTEND_DIST
        value: "true" # one origin: the API also serves the built SPA

databases:
  - name: bakehouse-db
    plan: basic-256mb # ~$7/mo; bump it when the order book grows
    region: oregon
