<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the page paints to the edges of a notched phone
         (the stylesheet pads the content back out of the notch);
         interactive-widget: the on-screen keyboard shrinks the layout, so a
         bar pinned to the bottom stays above the keys. Zoom is never disabled. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#851b31" />
    <!-- seo:start — the server writes this block for each address: its own
         title and description, its canonical address, its robots rule, the
         share card chats and social feeds show, and structured data
         (backend/app/seo.py). What stands here is what the dev server shows. -->
    <title>Djini's Bakehouse — Fresh from the oven</title>
    <meta name="description" content="Djini's Bakehouse — breads, pastries and more, to order online." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Djini's Bakehouse" />
    <meta property="og:title" content="Djini's Bakehouse — Fresh from the oven" />
    <meta property="og:description" content="Djini's Bakehouse — breads, pastries and more, to order online." />
    <meta property="og:url" content="https://djinisbakehouse.com/" />
    <meta property="og:image" content="https://djinisbakehouse.com/static/site/baker.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Djini's Bakehouse — Fresh from the oven" />
    <meta name="twitter:description" content="Djini's Bakehouse — breads, pastries and more, to order online." />
    <meta name="twitter:image" content="https://djinisbakehouse.com/static/site/baker.jpg" />
    <!-- seo:end -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Added to a phone's home screen, the shop opens like an app: its own
         icon, its own name, its own colours while it loads. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Djini's" />
    <!-- fonts:start — the three faces a page opens with (Fraunces upright and
         in its own italic, and Karla), fetched alongside the app rather than
         after it has drawn the page. The server keeps this block on the home
         page only (backend/app/seo.py): there it stops the hero's text
         reflowing as the faces arrive; elsewhere it only held back the first
         paint. The build writes in the files' hashed names. -->
    <link rel="preload" href="/node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource-variable/karla/files/karla-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- fonts:end -->
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const saved = localStorage.getItem("theme");
        if (saved) document.documentElement.setAttribute("data-theme", saved);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
