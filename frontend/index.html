<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Djini's Bakehouse — small-batch breads, pastries and sweet things baked from scratch every morning."
    />
    <meta name="theme-color" content="#7f2230" />
    <!-- What link previews on chats and social feeds show — the canonical
         domain, absolute URLs, so shares render everywhere. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Djini's Bakehouse" />
    <meta property="og:title" content="Djini's Bakehouse — Fresh from the oven" />
    <meta
      property="og:description"
      content="Small-batch breads, pastries and sweet things baked from scratch every morning — free delivery over $50."
    />
    <meta property="og:url" content="https://djinisbakehouse.com/" />
    <meta property="og:image" content="https://djinisbakehouse.com/static/site/baker.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Djini's Bakehouse — Fresh from the oven" />
    <meta
      name="twitter:description"
      content="Small-batch breads, pastries and sweet things baked from scratch every morning — free delivery over $50."
    />
    <meta name="twitter:image" content="https://djinisbakehouse.com/static/site/baker.jpg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Djini's Bakehouse — Fresh from the oven</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const saved = localStorage.getItem("theme");
        if (saved) document.documentElement.setAttribute("data-theme", saved);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
